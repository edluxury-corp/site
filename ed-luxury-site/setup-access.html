<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Activation de l’accès privé ED Luxury." />
  <title>ED Luxury — Activation de l’accès privé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css" />
  <style>
    body{min-height:100vh;background:#f6f6f6}.setup-page{min-height:100vh;display:grid;place-items:center;padding:60px 24px}.setup-card{width:min(560px,100%);padding:52px;background:#fbfaf7;border:1px solid var(--line)}.setup-card h1{margin:8px 0 18px;font-size:clamp(42px,5vw,58px);text-transform:none}.setup-card>p:not(.eyebrow):not(.setup-status){color:var(--muted);font-size:14px;line-height:1.8}.setup-form{display:grid;gap:22px;margin-top:34px}.setup-field{display:grid;gap:8px}.setup-field label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#5d554d}.setup-field input{width:100%;border:0;border-bottom:1px solid rgba(34,29,23,.28);background:transparent;padding:12px 0 13px;color:var(--ink);font:inherit;outline:none}.setup-field input[readonly]{color:#6f6a63}.setup-submit{margin-top:8px;border:0;padding:16px 22px;background:#b59661;color:#fff;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.setup-submit:disabled{opacity:.58}.setup-status{min-height:24px;margin:18px 0 0;font-size:12px;color:#7d756c}.setup-status.error{color:#8b3f35}.setup-status.success{color:#6d623f}.setup-back{display:inline-block;margin-top:24px;color:#8d6c38;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}@media(max-width:600px){.setup-card{padding:36px 24px}}
  </style>
</head>
<body>
  <main class="setup-page"><section class="setup-card"><p class="eyebrow">ED Luxury — accès privé</p><h1>Activer votre compte</h1><p>Cette page sert uniquement à créer le premier accès autorisé. L’adresse e-mail est verrouillée ; choisissez simplement votre mot de passe.</p>
    <form class="setup-form" id="setup-form"><div class="setup-field"><label for="email">Adresse e-mail</label><input id="email" type="email" value="edluxury.contact@gmail.com" readonly /></div><div class="setup-field"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="new-password" minlength="12" required placeholder="12 caractères minimum" /></div><div class="setup-field"><label for="password-confirm">Confirmer le mot de passe</label><input id="password-confirm" type="password" autocomplete="new-password" minlength="12" required placeholder="Répétez le mot de passe" /></div><button class="setup-submit" id="setup-submit" type="submit">Créer mon accès</button></form>
    <p class="setup-status" id="setup-status" aria-live="polite"></p><a class="setup-back" href="login.html">← Retour à la connexion</a></section></main>
  <script src="script.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase=createClient('https://xyjupseviramwfekttjh.supabase.co','sb_publishable_MEwqY-CLaEIOdM370VFMLA_r0z7X2uw');const form=document.getElementById('setup-form'),password=document.getElementById('password'),passwordConfirm=document.getElementById('password-confirm'),submit=document.getElementById('setup-submit'),status=document.getElementById('setup-status'),email='edluxury.contact@gmail.com';
    form.addEventListener('submit',async e=>{e.preventDefault();status.className='setup-status';status.textContent='';if(password.value!==passwordConfirm.value){status.className='setup-status error';status.textContent='Les deux mots de passe ne correspondent pas.';return}submit.disabled=true;submit.textContent='Création…';const{data,error}=await supabase.auth.signUp({email,password:password.value,options:{data:{full_name:'ED Luxury'}}});if(error){status.className='setup-status error';status.textContent=error.message.includes('already registered')?'Ce compte existe déjà. Utilisez la page de connexion.':'Impossible de créer le compte. Vérifiez le mot de passe puis réessayez.';submit.disabled=false;submit.textContent='Créer mon accès';return}if(data.session){status.className='setup-status success';status.textContent='Compte créé. Redirection vers l’espace privé…';window.location.replace('private.html')}else{status.className='setup-status success';status.textContent='Compte créé. Vérifiez maintenant la boîte Gmail ED Luxury et confirmez l’adresse, puis revenez sur la page de connexion.';submit.textContent='Compte créé'}});
  </script>
</body>
</html>
